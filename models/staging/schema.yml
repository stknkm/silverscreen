version: 2

sources:
  - name: silverscreen  
    database: silverscreen 
    schema: public
    tables:   
      - name: invoices_raw
        description: Represents the invoices issued for showing a specific movie at various theater locations during different months.
      - name: movie_catalogue
        description: Raw movie catalogue containing metadata for all films.
      - name: transactions_1
        description: Transactions from location 1.
      - name: transactions_2
        description: Transactions from location 2.
      - name: transactions_3
        description: Transactions from location 3.

models:
  - name: stg_clean_movie_catalogue
    description: >
      This model cleans and standardizes the movie catalogue data. 
      It replaces missing genres and ratings with 'Unknown' and preserves key metadata 
      such as title, release date, country, studio, budget, and director.
    columns:
      - name: movie_id
        description: Unique identifier for each movie.
        tests:
          - not_null
          - unique  

  - name: stg_transactions_1
    description: >
      Staging model location (NJ_001), which aggregates raw transactions 
      by movie, month, and location. It calculates total ticket sales and revenue 
      (transaction_total) per movie per month.
    columns:
      - name: location
        description: Location code of the theater. Hardcoded as 'NJ_001'.
        tests:
          - not_null

      - name: month
        description: The month extracted from the transaction timestamp using the `get_month` macro.
        tests:
          - not_null

      - name: movie_id
        description: Unique identifier of the movie shown at this location.
        tests:
          - not_null

      - name: ticket_amount
        description: Total number of tickets sold for the movie at this location in the given month.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "{{ ticket_amount }} >= 0"

      - name: transaction_total
        description: Total revenue generated by the movie at this location in the given month.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "{{ transaction_total }} >= 0" 

  - name: stg_transactions_2
    description: >
